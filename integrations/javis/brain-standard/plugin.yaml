name: "Brain 4.0 (Brain_Standard)"
name_en: "Brain 4.0 (Brain_Standard)"
slug: brain-standard
version: 4.0.0
description: "Exposes the brain commands (capture, submit, check, turn, weekly, assigned, report) as tools for every Javis engine, and stops the AI from writing permanent notes, agent items or templates directly, or assigning tasks to itself. The brain in Javis must be a Brain_Standard repository (brain.toml at its root)."
description_en: "Exposes the brain commands (capture, submit, check, turn, weekly, assigned, report) as tools for every Javis engine, and stops the AI from writing permanent notes, agent items or templates directly, or assigning tasks to itself. The brain in Javis must be a Brain_Standard repository (brain.toml at its root)."
author: Brain_Standard
enabled: false
min_mode: safe
tools:
  - brain_capture
  - brain_submit
  - brain_check
  - brain_turn
  - brain_weekly
  - brain_assigned
  - brain_report
hooks:
  - pre_tool_call
