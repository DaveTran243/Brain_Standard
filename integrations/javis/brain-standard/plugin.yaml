name: Bộ não 3.0 (Brain_Standard)
name_en: "Brain 3.0 (Brain_Standard)"
slug: brain-standard
version: 3.0.0
description: Đưa lệnh brain (ghi, nop, kiem, turn, weekly, javis, xong) thành tool cho mọi engine của Javis, và chặn AI ghi thẳng vào permanent note, file mẫu, 00-Inbox/agent, cùng việc tự gắn nhãn @javis. Cần brain này là một repo Brain_Standard (có brain.toml ở gốc).
description_en: "Exposes the brain CLI (ghi, nop, kiem, turn, weekly, javis, xong) as tools for every Javis engine, and stops the AI from writing permanent notes, templates or 00-Inbox/agent directly, or tagging @javis itself. Needs the brain to be a Brain_Standard repo (brain.toml at its root)."
author: Brain_Standard
enabled: false
min_mode: safe
tools:
  - brain_ghi
  - brain_nop
  - brain_kiem
  - brain_turn
  - brain_weekly
  - brain_viec_javis
  - brain_xong
hooks:
  - pre_tool_call
