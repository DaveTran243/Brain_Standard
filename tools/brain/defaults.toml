# Brain_Standard · default configuration.
# Every parameter the CLI, the hooks and the agent integrations use lives here.
# A brain overrides any of these in its own brain.toml; keys it leaves out keep these values.
# Names are explained in docs/glossary.md.

[brain]
version = "4.4.0"
vault = "vault"                     # vault folder, relative to the folder that holds brain.toml

[paths]                             # relative to the vault
inbox = "00-Inbox/Inbox.md"
inbox_agent = "00-Inbox/agent"
next_actions = "10-Action/11-next-actions.md"
waiting_for = "10-Action/12-waiting-for.md"
projects = "10-Action/13-Projects"
someday = "10-Action/14-someday.md"
areas = "20-Areas"
fleeting = "30-Knowledge/fleeting"
literature = "30-Knowledge/literature"
permanent = "30-Knowledge/permanent"
maps = "40-Maps"
code = "Code"
archive = "90-Archive"
weekly = "weekly"
log = "_log"
turn_log = "_log/turns.md"
rejected_log = "_log/rejected.md"
templates = "_templates"
kg_triples = "_kg/triples.jsonl"   # the knowledge graph; under "_", so the write guard keeps AIs out
kg_state = "_kg/state.json"
drive_graph = "_kg/drive.jsonl"     # the platform map ([drive]); machine-local, git ignores it
drive_state = "_kg/drive-state.json"
hook_state = "_log/.hooks"         # what the prompt hook hands to the Stop hook, per session
scripts = "Code/52 Scripts"         # the script library ([scripts]); an absolute path puts it outside the vault
script_log = "_log/scripts.md"      # every script file added or changed, with its sha256; brain commands only

[files]
template_prefix = "_"               # files and folders starting with this are templates or logs: skipped by checks
inbox_header = "# Inbox\n\n## Items\n"
turn_log_header = "# Turns\n\n"
rejected_log_header = "# G1 · rejected items\n\n"
weekly_title = "# Weekly Review · {week}\n\n"

[capture]
default_channel = "hand"

[clarify]
fleeting_max_days = 7               # older fleeting notes raise a warning
moc_min_notes = 7                   # guidance: make a map of content once a cluster has this many notes

[rhythm]
daily_pick_max = 3                  # guidance for the daily loop; never blocks capture

[turn]
types = ["task", "idea", "file", "drop"]

[project]
statuses = ["someday", "active", "done", "stopped"]
active_status = "active"
done_status = "done"
stopped_status = "stopped"
required_when_active = ["outcome", "done_when", "stop_when"]

[notes]
date_keys = ["date", "read_on", "retrieved", "started"]   # first one present gives the note's date
link_keys = ["links"]                                      # frontmatter keys that may hold [[links]]

[gates]
strict = true                       # G1 returns incomplete records; brain turn refuses to close while the vault has errors
required_fields = ["source", "retrieved", "archived", "grade", "verification"]
sources = "ABCDEF"                  # source reliability, best first
credibility = [1, 2, 3, 4, 5, 6]    # information credibility, best first
reject_sources = ["E"]
reject_credibility = [5]
fleeting_only_sources = ["D", "F"]
literature_sources = ["A", "B", "C"]   # G2
permanent_credibility = [1, 2]         # G3
card_credibility = [1, 2]              # G4
unverified_label = "unverified"

[gates.reach_names]                 # how a reach is written in the Inbox line
card = "flashcard"
literature = "literature"
fleeting = "fleeting (unverified)"

[execution]
warn_milestone_without_board = true    # EX-01
warn_project_without_task = true       # EX-02

[johnny_decimal]
area = "50-59"
max_categories = 10

[assistant]
# Platform-neutral: any agent (Javis OS, OpenClaw, Hermes, n8n, Claude…) follows up through the shared tools in
# tools/brain/agent_tools.py. Each platform's adapter lives in integrations/.
name = "the assistant"
label = "@agent"                    # written on a next action as @agent:<level>
levels = ["suggest", "auto", "full"]   # lowest first; a level is the ceiling for a task
stale_after_days = 7                # AS-02
result_channel = "assistant"        # channel of the result line written to the Inbox by brain report

[assistant.plugin]
timeout_seconds = 60                # a brain command run by an integration is stopped after this
default_channel = "assistant"       # channel brain_capture uses when the caller gives none

[assistant.guard]
# Paths (keys of [paths]) an AI may never write to directly.
protected = ["permanent", "inbox_agent"]
# The file where an AI may not add or raise an assignment label.
label_file = "next_actions"
write_tools = ["Write", "Edit", "MultiEdit", "NotebookEdit"]   # Claude Code's; an integration passes its own

[drive]
# The platform root and its map (tools/brain/drive.py, docs/platform-map.md). A brain that keeps its whole platform
# on one disk or folder (functions, memory, library, archive) sets enabled and root; agents then save every result
# there, the map records it, and agents read the map before they open anything on the root.
enabled = false
root = ""                      # e.g. "D:/" or "~/brain-platform"
inbox = ""                     # where a produced file with no home yet is saved, e.g. "D:/Brain/00-Inbox"
jd_index = "Code/50 System/50.00 Index (JDex).md"   # relative to the vault; JD numbers are attached to their locations
skip = [".git", "node_modules", "__pycache__", ".dart_tool", "build", ".idea", ".venv", "venv", "dist", ".next", ".pytest_cache", ".mypy_cache", ".gradle", ".cache", "$RECYCLE.BIN", "System Volume Information"]
skip_files = ["pagefile.sys", "hiberfil.sys", "swapfile.sys", "DumpStack.log.tmp", "desktop.ini", "Thumbs.db", ".DS_Store"]
bulk_files = 200               # a folder with more files than this is a dataset: one node with counts, no file nodes
max_depth = 14
read_on_prompt = true          # brain hook prompt adds the locations a prompt names
update_on_stop = true          # brain hook stop re-reads the folders that changed during the turn
max_hits = 8
min_score = 4                  # a hit shown by the prompt hook needs at least this score (3 per word in its name)
demote = ["90-Archive"]        # folders whose copies rank below the live ones
stopwords = []

[search]
# brain search and brain eval (tools/brain/search.py, ADR-08): BM25 over the sections of the vault's notes. All matching
# goes through textnorm.fold, so diacritics, no diacritics and NFD all match. Skipped: the Inbox, anything starting
# with the template prefix "_", and the exclude list below.
index = ".brain/search-index.json"  # relative to the folder that holds brain.toml; derived, never committed
k = 8                               # results returned (BR-04); recall@k in brain eval uses the same k
k1 = 1.2                            # BM25 term-frequency saturation
b = 0.75                            # BM25 length normalisation
min_coverage = 0.5                  # a section must hold at least this share of the query's content words
max_chars = 6000                    # what an agent receives from brain_search, at most
questions = "_eval/questions.md"    # brain eval's questions, relative to the vault; written by the owner only
exclude = []                        # more paths or globs relative to the vault, e.g. ["Code/99-private", "*/drafts/*"]
# Two optional ranking signals (BR-10, BR-11), off until brain eval --compare shows they do not lower recall@k.
recency_weight = 0                  # > 0: newer notes rise; e.g. 0.3
recency_half_life_days = 90         # a note this old gets half the boost of one written today
graph_weight = 0                    # > 0: Personalized PageRank over [[links]] from the BM25 hits; e.g. 0.5
graph_damping = 0.5                 # share of a note's rank passed along its links at each step

[read]
# brain read and brain cite-check (tools/brain/reading.py): what an agent may read, and how citations are checked.
max_lines = 200                     # lines one brain read returns at most
quote_window = 3                    # a quoted citation passes if the words are within this many lines of path:line

[dashboard]
# brain dashboard (tools/brain/dashboard.py, docs/dashboard.md, ADR-20): a read-only page on 127.0.0.1 with the brain's
# four golden signals (traffic, latency, errors, saturation). It never writes and shows no note content.
port = 7799
refresh_s = 30                      # the page asks for new numbers this often
cache_s = 10                        # the server reads the brain at most this often
days = 30                           # the activity chart and sparklines
timeline_n = 20                     # turns in the timeline
inbox_max_age_days = 7              # latency turns amber past this (the Inbox header says 7 days)
weekly_max_gap_days = 8             # days since the newest Weekly Review before latency turns amber
name = ""                           # the label in the brain picker; empty = "main"
brains = []                         # other brain folders to offer in the picker, relative to this one

[scripts]
# The script library (tools/brain/scripts.py, docs/script-library.md, ADR-21). Every script an AI generates is saved
# on the owner's disk, in [paths] scripts, filed by topic (one Johnny Decimal AC.ID per topic, its JDex line first)
# and kept as one file per operating system: <name>.<os>.<ext>, plus a manifest <name>.md.
enabled = true
category = "52"
category_name = "Scripts"
required_os = ["linux", "rhel", "macos", "windows"]   # SC-03: a variant for each, or not_applicable with a reason
any_os = "any"                      # <name>.any.<ext> runs everywhere (Python, for instance) and covers every OS
fallback_topic = "99"               # where a script whose topic could not be told goes; SC-08 until it is moved
default_by = "agent"                # generated_by when the caller does not say
capture_on_write = true             # brain hook script: a script an AI writes anywhere is filed into the library
capture_extensions = [".sh", ".bash", ".zsh", ".command", ".ps1", ".psm1", ".bat", ".cmd"]
capture_skip = [".git", "node_modules", ".venv", "venv", "__pycache__", "dist", "build"]
capture_skip_globs = []             # e.g. ["*/vendor/*"]

# One table per operating system, in priority order. extensions: what a variant may be; avoid: commands that OS does
# not have by default (SC-07); detect: commands that tell a script was written for it (brain script add without --os).
[scripts.os.linux]
label = "Linux (Debian, Ubuntu and generic)"
extensions = [".sh", ".bash", ".py"]
avoid = ["dnf", "yum", "rpm", "firewall-cmd", "brew", "launchctl", "pbcopy"]

[scripts.os.rhel]
label = "Red Hat family (RHEL, Rocky, AlmaLinux, CentOS Stream, Fedora)"
extensions = [".sh", ".bash", ".py"]
avoid = ["apt", "apt-get", "dpkg", "ufw", "brew", "launchctl", "pbcopy"]

[scripts.os.macos]
label = "macOS (zsh, bash 3.2, BSD tools)"
extensions = [".sh", ".zsh", ".bash", ".command", ".py"]
avoid = ["apt", "apt-get", "dnf", "yum", "systemctl", "journalctl", "free", "ss", "ufw", "firewall-cmd", "ip"]

[scripts.os.windows]
label = "Windows (PowerShell 5.1 and 7)"
extensions = [".ps1", ".psm1", ".bat", ".cmd", ".py"]
avoid = ["sudo", "apt", "apt-get", "dnf", "yum", "brew", "chmod", "systemctl", "grep", "sed", "awk"]

[scripts.detect]
rhel = ["dnf", "yum", "rpm", "firewall-cmd", "subscription-manager", "semanage", "restorecon", "getenforce"]
macos = ["brew", "launchctl", "osascript", "diskutil", "pbcopy", "pbpaste", "scutil", "networksetup", "sw_vers"]
linux = ["apt", "apt-get", "dpkg", "ufw", "systemctl", "journalctl"]

# Topics: one AC.ID each (52.01 …). The keywords classify a script that comes without --topic. Add your own topics
# in brain.toml; a folder "52.NN name" the owner creates is a topic too.
[scripts.topics."01"]
name = "system"
keywords = ["system", "service", "services", "systemctl", "user", "users", "group", "cron", "boot", "kernel", "update", "upgrade", "reboot", "hostname", "timezone", "process", "he thong"]
[scripts.topics."02"]
name = "network"
keywords = ["network", "port", "ports", "dns", "ping", "ip", "ssh", "proxy", "vpn", "firewall", "curl", "http", "tcp", "udp", "route", "wifi", "mang"]
[scripts.topics."03"]
name = "storage-backup"
keywords = ["disk", "backup", "restore", "rsync", "mount", "partition", "snapshot", "archive", "tar", "zip", "storage", "volume", "sao luu"]
[scripts.topics."04"]
name = "security"
keywords = ["security", "ssl", "tls", "cert", "certificate", "audit", "permission", "permissions", "harden", "hardening", "password", "selinux", "scan", "gpg", "key", "keys", "bao mat"]
[scripts.topics."05"]
name = "dev-tools"
keywords = ["developer", "brew", "homebrew", "git", "build", "compile", "python", "node", "npm", "pip", "java", "go", "rust", "sdk", "ide", "lint", "test", "venv", "dev"]
[scripts.topics."06"]
name = "containers-cloud"
keywords = ["docker", "podman", "container", "containers", "kubernetes", "k8s", "kubectl", "helm", "aws", "azure", "gcloud", "gcp", "terraform", "cloud", "vm"]
[scripts.topics."07"]
name = "monitoring-logs"
keywords = ["log", "logs", "monitor", "monitoring", "cpu", "memory", "ram", "health", "metrics", "alert", "uptime", "journal", "nhat ky"]
[scripts.topics."08"]
name = "files-data"
keywords = ["file", "files", "rename", "csv", "json", "convert", "image", "images", "video", "pdf", "excel", "duplicate", "folder", "clean", "tep"]
[scripts.topics."09"]
name = "automation"
keywords = ["automation", "schedule", "notify", "notification", "telegram", "email", "webhook", "bot", "task", "workflow", "tu dong"]
[scripts.topics."10"]
name = "database"
keywords = ["database", "db", "mysql", "mariadb", "postgres", "postgresql", "redis", "mongo", "mongodb", "sqlite", "sql", "dump"]
[scripts.topics."99"]
name = "unsorted"
keywords = []

[kg]
# The knowledge graph (tools/brain/kg.py, docs/knowledge-graph.md): read before every conversation, updated after it.
enabled = true
read_on_prompt = true          # brain hook prompt adds what the graph holds about the prompt
update_on_stop = true          # brain hook stop folds the turn into the graph
kinds = ["permanent", "literature", "fleeting", "project", "area", "moc", "next", "script"]   # the Inbox is never read
max_facts = 15
hops = 2
max_seeds = 6
max_memory_facts = 8
max_stale_documents = 20       # KG-01 warns when more documents than this changed since the last build
stopwords = []
sentence_rules = true
sentence_verbs = ["is a", "is an", "is", "are", "uses", "requires", "causes", "depends on", "replaces", "contains", "leads to", "decides", "là", "gồm", "dùng", "cần", "gây ra", "phụ thuộc vào", "thay thế", "thuộc", "quyết định", "dẫn tới"]
sentence_max_subject_words = 6
sentence_max_object_words = 8
infer_taxonomy = true
infer_min_chars = 4
infer_max_words = 4
max_inferred_ratio = 0.5
llm = "auto"                   # auto: use the LLM when llm_base_url and llm_model are set · on · off
llm_base_url = ""              # OpenAI-compatible chat completions URL, e.g. http://localhost:11434/v1/chat/completions
llm_model = ""
llm_api_key_env = ""           # name of the environment variable holding the key (never the key itself)
llm_temperature = 0.2
llm_timeout = 120
llm_in_hooks = false
chunk_words = 100
chunk_overlap = 20
max_predicate_words = 3
suggest_min_degree = 4
suggest_hubs = 25
suggest_min_chats = 3
